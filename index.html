    <style>
        /* הסתרת אלמנטים */
        .hidden { display: none !important; }
        
        /* עיצוב פס גלילה */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); border-radius: 4px; }
        
        /* הסרת מסגרת מנגן יוטיוב */
        iframe { border: none; }

        /* הנפשת נשימה ירוקה לטקסט */
        @keyframes text-breathe {
            0%, 100% { color: #34d399; text-shadow: 0 0 8px rgba(52, 211, 153, 0.6); }
            50% { color: #065f46; text-shadow: none; }
        }
        .animate-text-breathe {
            animation: text-breathe 2.5s ease-in-out infinite;
        }

        /* מניעת סימון טקסט במערכת */
        body {
            user-select: none;
            -webkit-user-select: none;
        }

        /* עיצוב סליידרים בהתאמה אישית לנגן שלנו */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #60a5fa;
            cursor: pointer;
            margin-top: -4px;
            box-shadow: 0 0 10px rgba(96, 165, 250, 0.5);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
    </style>
</head>

            if (mainPlayer && mainPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                uiTimeout = setTimeout(() => {
                    videoInfoOverlay.classList.add('opacity-0');
                    customControls.classList.add('opacity-0', 'translate-y-full');
                    videoSection.classList.add('cursor-none');
                }, 3000);
            }
        }

        videoSection.addEventListener('mousemove', showVideoUI);
        videoSection.addEventListener('click', showVideoUI);
        videoSection.addEventListener('mouseleave', () => {
            if (mainPlayer && mainPlayer.getPlayerState() === YT.PlayerState.PLAYING) {
                videoInfoOverlay.classList.add('opacity-0');
                customControls.classList.add('opacity-0', 'translate-y-full');
            }
        });

        // --- התחברות ---
        function handleLogin(e) {
            e.preventDefault();
            const inputEncoded = btoa(passwordInput.value.trim());
            if (inputEncoded === ENCODED_PASSWORD) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                renderList();
            } else {
                errorMessage.textContent = "סיסמה שגויה, אנא נסה שנית";
                errorMessage.classList.remove('hidden');
            }
            return false;
        }

        // --- פתיחת חלונית מידע (Modal) ---
        function openModal(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;
            selectedLessonForModal = lesson;
            
            modalTitle.textContent = lesson.title;
            modalDesc.innerHTML = lesson.description;
            modalType.textContent = lesson.type === 'lecture' ? 'הרצאה תיאורטית' : 'סדנא מעשית';
            
            if (lesson.type === 'workshop') {
                modalInfoTitle.classList.add('hidden');
                modalInfoTitle.classList.remove('flex');
            } else {
                modalInfoTitle.classList.remove('hidden');
                modalInfoTitle.classList.add('flex');
            }
            
            modalIcon.innerHTML = `<i data-lucide="${lesson.type === 'lecture' ? 'video' : 'laptop'}" class="w-5 h-5"></i>`;
            modalIcon.className = `w-10 h-10 rounded-lg flex items-center justify-center text-lg font-bold ${
                lesson.type === 'lecture' ? 'bg-blue-500/20 text-blue-400' : 'bg-purple-500/20 text-purple-400'
            }`;

            btnPresentation.classList.toggle('hidden', !lesson.presentationUrl);
            btnPresentation.classList.toggle('flex', !!lesson.presentationUrl);
            btnWorkbook.classList.toggle('hidden', !lesson.workbookUrl);
            btnWorkbook.classList.toggle('flex', !!lesson.workbookUrl);

            if (activeLessonId === lesson.id) {
                modalPlayBtn.className = "w-full flex items-center justify-center gap-2 py-3 rounded-xl font-semibold transition-all bg-slate-800 text-blue-400 border border-slate-700 hover:bg-slate-700 cursor-pointer";
                modalPlayText.textContent = "המשך צפייה";
            } else {
                modalPlayBtn.className = "w-full flex items-center justify-center gap-2 py-3 rounded-xl font-semibold transition-all bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20 cursor-pointer";
                modalPlayText.textContent = "התחל צפייה";
            }
            
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() { modal.classList.add('hidden'); selectedLessonForModal = null; }
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

        function playFromModal() {
            if (selectedLessonForModal) {
                playLesson(selectedLessonForModal.id);
                closeModal();
            }
        }

        function openResource(type) {
            if (!selectedLessonForModal) return;
            let targetUrl = type === 'presentation' ? selectedLessonForModal.presentationUrl : selectedLessonForModal.workbookUrl;
            if (targetUrl) {
                const windowFeatures = "menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes,width=1000,height=800,top=100,left=100";
                window.open(targetUrl, 'CourseResource', windowFeatures);
            }
        }

        function openExternalLink(url) {
            window.open(url, 'ExternalTool', "menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes,width=1000,height=800,top=100,left=100");
        }

        // --- שליטה מותאמת בנגן היוטיוב ---
        
        function formatTime(seconds) {
            if (isNaN(seconds)) return "00:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        function updateProgressBar() {
            if(!mainPlayer || typeof mainPlayer.getCurrentTime !== 'function' || isSeeking) return;
            const current = mainPlayer.getCurrentTime();
            const duration = mainPlayer.getDuration();
            if(duration > 0) {
                const percent = (current / duration) * 100;
                document.getElementById('progress-bar').value = percent;
                document.getElementById('time-current').textContent = formatTime(current);
                document.getElementById('time-total').textContent = formatTime(duration);
            }
        }

        function seekVideo(percent) {
            if(!mainPlayer) return;
            const duration = mainPlayer.getDuration();
            const seekToTime = (percent / 100) * duration;
            mainPlayer.seekTo(seekToTime, true);
        }

        function togglePlayPause(e) {
            if(e) e.stopPropagation();
            if(!mainPlayer || typeof mainPlayer.getPlayerState !== 'function') return;
            const state = mainPlayer.getPlayerState();
            if(state === YT.PlayerState.PLAYING) {
                mainPlayer.pauseVideo();
            } else {
                mainPlayer.playVideo();
            }
        }

        function changeVolume(val) {
            if(!mainPlayer) return;
            mainPlayer.setVolume(val);
            if(mainPlayer.isMuted()) mainPlayer.unMute();
            updateVolumeIcon(val);
        }

        function toggleMute(e) {
            if(e) e.stopPropagation();
            if(!mainPlayer) return;
            if(mainPlayer.isMuted()) {
                mainPlayer.unMute();
                const vol = mainPlayer.getVolume();
                document.getElementById('volume-slider').value = vol;
                updateVolumeIcon(vol);
            } else {
                mainPlayer.mute();
                document.getElementById('volume-slider').value = 0;
                updateVolumeIcon(0);
            }
        }

        function updateVolumeIcon(val) {
            const icon = document.getElementById('icon-volume');
            if(val == 0 || (mainPlayer && mainPlayer.isMuted())) icon.setAttribute('data-lucide', 'volume-x');
            else if(val < 50) icon.setAttribute('data-lucide', 'volume-1');
            else icon.setAttribute('data-lucide', 'volume-2');
            lucide.createIcons();
        }

        function toggleFullScreen(e) {
            if(e) e.stopPropagation();
            const container = document.getElementById('main-video-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => console.log(`Error fullscreen: ${err.message}`));
            } else {
                document.exitFullscreen();
            }
        }

        // --- הפעלת שיעור ---
        function playLesson(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;
            if (!isYoutubeReady) { alert("מערכת הוידאו עדיין נטענת. אנא המתן שניה ונסה שוב."); return; }

            activeLessonId = lesson.id;
            currentLessonTitle.textContent = lesson.title;
            currentLessonType.textContent = lesson.type === 'lecture' ? 'הרצאה תיאורטית' : 'סדנא מעשית';

            mainPlaceholder.classList.add('hidden');
            mainVideoContainer.classList.remove('hidden');
            instructorPlaceholder.classList.add('hidden');
            instructorWrapper.classList.remove('hidden');
            instructorLabel.classList.remove('hidden');
            
            showVideoUI();

            if (!mainPlayer) {
                mainPlayer = new YT.Player('main-video', {
                    height: '100%',
                    width: '100%',
                    videoId: lesson.mainVideoId,
                    playerVars: {
                        'rel': 0, 
                        'modestbranding': 1, 
                        'playsinline': 1,
                        'controls': 0, // מעלים לחלוטין את הנגן המקורי של יוטיוב
                        'disablekb': 1,
                        'fs': 0,
                        'autoplay': 1
                    },
                    events: {
                        'onReady': (e) => { 
                            e.target.playVideo(); // פליי אוטומטי
                            updateVolumeIcon(e.target.getVolume());
                            document.getElementById('volume-slider').value = e.target.getVolume();
                        },
                        'onStateChange': onMainPlayerStateChange
                    }
                });

                instructorPlayer = new YT.Player('instructor-video', {
                    height: '100%',
                    width: '100%',
                    videoId: lesson.instructorVideoId,
                    playerVars: {
                        'rel': 0, 'modestbranding': 1, 'controls': 0, 'disablekb': 1, 'playsinline': 1, 'autoplay': 1
                    },
                    events: {
                        'onReady': (e) => { e.target.mute(); e.target.playVideo(); }
                    }
                });
            } else {
                mainPlayer.loadVideoById({videoId: lesson.mainVideoId});
                instructorPlayer.loadVideoById({videoId: lesson.instructorVideoId});
            }

            renderList(); 
        }

        // --- סנכרון וניהול סטטוס נגן ---
        function onMainPlayerStateChange(event) {
            showVideoUI();
            
            const icon = document.getElementById('icon-play-pause');
            
            if (event.data === YT.PlayerState.PLAYING) {
                icon.setAttribute('data-lucide', 'pause');
                if(progressInterval) clearInterval(progressInterval);
                progressInterval = setInterval(updateProgressBar, 500);
                
                if (instructorPlayer && typeof instructorPlayer.playVideo === 'function') {
                    const mainTime = mainPlayer.getCurrentTime();
                    const instTime = instructorPlayer.getCurrentTime();
                    if (Math.abs(mainTime - instTime) > 0.5) instructorPlayer.seekTo(mainTime, true);
                    instructorPlayer.playVideo();
                }
            } 
            else {
                icon.setAttribute('data-lucide', 'play');
                if(progressInterval) clearInterval(progressInterval);
                
                if (instructorPlayer && typeof instructorPlayer.pauseVideo === 'function') {
                    if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.BUFFERING) {
                        instructorPlayer.pauseVideo();
                    } else if (event.data === YT.PlayerState.ENDED) {
                        instructorPlayer.stopVideo();
                    }
                }
            }
            lucide.createIcons();
        }

        // --- סינון תוכן ---
        function toggleFilter(skillId) {
            currentFilter = currentFilter === skillId ? 'all' : skillId; 
            const allSkills = ['ai', 'research', 'management', 'innovation', 'design'];
            allSkills.forEach(id => {
                const btn = document.getElementById('filter-' + id);
                if (!btn) return;
                btn.className = currentFilter === id 
                    ? "bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-md transition-colors font-bold cursor-pointer"
                    : "bg-slate-800 hover:bg-slate-700 text-slate-400 border border-transparent px-2 py-1 rounded-md transition-colors cursor-pointer";
            });
            renderList();
        }

        // --- רינדור רשימה ---
        function renderList() {
            lessonList.innerHTML = '';
            let filteredLessons = currentFilter === 'all' ? [...lessonsData] : lessonsData.filter(lesson => lesson.skill === currentFilter);
            
            filteredLessons.sort((a, b) => {
                if (a.type === 'workshop' && b.type === 'lecture') return -1;
                if (a.type === 'lecture' && b.type === 'workshop') return 1;
                return a.id - b.id;
            });
            
            filteredLessons.forEach((lesson, index) => {
                const isActive = activeLessonId === lesson.id;
                const isLecture = lesson.type === 'lecture';
                const typeClass = isLecture ? 'bg-blue-500/20 text-blue-400' : 'bg-purple-500/20 text-purple-400';
                const textClass = isActive ? 'text-blue-400' : 'text-slate-200';
                const borderClass = isActive ? 'border border-blue-500/30 bg-slate-800/60' : 'border border-transparent bg-slate-800/20 hover:bg-slate-800/40';

                const typeBadge = isLecture
                    ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 leading-none">הרצאה</span>`
                    : `<span class="text-[9px] px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 leading-none">סדנא</span>`;

                const itemHtml = `
                    <button onclick="openModal(${lesson.id})" class="w-full px-2.5 py-2 flex items-center justify-between text-right rounded-lg transition-all duration-200 ${borderClass} group cursor-pointer">
                        <div class="flex items-center gap-3 w-full overflow-hidden">
                            <span class="w-7 h-7 flex-shrink-0 rounded-md flex items-center justify-center text-[12px] font-bold ${typeClass}">
                                ${index + 1}
                            </span>
                            <div class="flex flex-col items-start truncate overflow-hidden">
                                <span class="text-[13px] font-medium ${textClass} truncate w-full text-right mb-0.5">
                                    ${lesson.title}
                                </span>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    ${typeBadge}
                                    <span class="text-[10px] text-slate-400 truncate">${skillsMap[lesson.skill]}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex-shrink-0 ml-1">
                        ${isActive 
                            ? `<i data-lucide="play-circle" class="w-4 h-4 text-blue-400"></i>` 
                            : `<i data-lucide="info" class="w-4 h-4 text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>`
                        }
                        </div>
                    </button>
                `;
                lessonList.insertAdjacentHTML('beforeend', itemHtml);
            });
            if (typeof lucide !== 'undefined') { lucide.createIcons(); }
        }
    </script>
</body>
</html>
