            { id: 9, title: "ניתוח נתונים והפקת תובנות", type: "lecture", skill: "research", description: "• נכיר כלי AI שימושיים לניתוח DATA<br>• נבין כיצד לשלוף נתונים מתוך דוחות ומסמכים מרובים<br>• נפתח יכולת זיהוי מגמות ותובנות עסקיות מנתונים<br>• נתרגל יצירת המחשות ויזואליות חכמות לנתונים באמצעות כלי AI<br>• נלמד כיצד לשמור על אבטחת מידע ולמנוע דליפה של נתונים רגישים", mainVideoId: "aqz-KE-bpKQ", instructorVideoId: "eRsGyueVLvQ", presentationUrl: "9-1.pdf", workbookUrl: "9-2.pdf" },
            { id: 10, title: "תכנון ובניית סוכני AI", type: "lecture", skill: "innovation", description: "• נבין מהו סוכן AI ואילו משימות הוא מסוגל לבצע באופן עצמאי<br>• נלמד להגדיר סוכן: מקבלת קלט ועד לביצוע התוצר הסופי<br>• נזהה שלבים בתהליכים ארגוניים שניתן לבצע באמצעות סוכני AI<br>• נלמד לזהות שלבים בתהליך בהם יש צורך במעורבות ובקרה אנושית<br>• נצפה בהדגמה בלייב של רצף פעולות המתבצעות ע\"י סוכן AI", mainVideoId: "aqz-KE-bpKQ", instructorVideoId: "eRsGyueVLvQ", presentationUrl: "10-1.pdf", workbookUrl: "10-2.pdf" },

            { id: 13, title: "איתור מידע ו-Deep Research", type: "lecture", skill: "research", description: "• נלמד לבצע חיפוש מידע מדויק וממוקד בעזרת כלי AI<br>• נתרגל טכניקות לשמירה על אמינות ואיתור מקורות מידע רלוונטיים<br>• נשתמש בכלי מחקר מתקדמים לסיכום מאמרים וסקירת תכנים מקצועיים<br>• נכיר את פונקציית ה–Deep Research בכלי LLM לביצוע תהליך מעמיק<br>• נלמד להשתמש במידע שנאסף כדי להפיק תובנות ולקבל החלטות", mainVideoId: "aqz-KE-bpKQ", instructorVideoId: "eRsGyueVLvQ", presentationUrl: "13-1.pdf", workbookUrl: "13-2.pdf" },

            { id: 17, title: "סדנת Copilot", type: "workshop", skill: "ai", description: "<b class='text-white block mb-1'>עוזר ה-AI שמשתלב בסביבת העבודה של Microsoft</b><br><b class='text-blue-400 block mt-2 mb-1'>בסיום הסדנה תדעו:</b>• להפוך רעיונות למצגת מעוצבת עם Copilot ב-PowerPoint<br>• לנתח ולקבל תובנות מיידיות מהנתונים שלכם ב-Excel<br>• לנסח ולערוך טקסטים ב-Word עם Copilot<br>• לנהל מיילים ומשימות ביעילות ע\"י שילוב יכולות AI ב-Outlook<br>• ניהול חכם של פגישות וישיבות ב-Teams<br>• לחבר בין Copilot לתוכן הארגוני ולשדרג את שימור הידע בארגון<br>• כיצד לשמור על אבטחת מידע ופרטיות עם Copilot<br>• להשתמש ביכולות המתקדמות של חשבון בתשלום<br><br><b class='text-blue-400 block mb-1'>מומלץ להכין מראש:</b>• דוגמאות ממשימות העבודה שלך עבור התרגול בסדנה<br>• חשבון משתמש ב-Copilot<br><br><small class='text-slate-500'>*בסדנה יוצגו גם פיצ'רים מתוך המנוי בתשלום</small>", mainVideoId: "cx9lvxEFRYA", instructorVideoId: "ckPYOidV2xE", presentationUrl: "17-1.pdf", workbookUrl: "https://digitalculture-workshop-copilot.lovable.app/" },
            { id: 18, title: "סדנת Gemini", type: "workshop", skill: "ai", description: "<b class='text-white block mb-1'>להכיר את הדור החדש של ה-AI מבית גוגל</b><br><b class='text-blue-400 block mt-2 mb-1'>בסיום הסדנה תדעו:</b>• ליצור תוכן מהיר: אימיילים, מצגות ודו\"חות עם Gemini<br>• לדבר עם Gemini Live בשילוב שיחה קולית ושיתוף מסך<br>• ליצור עם AI Studio תמונות (Nano Banana), סרטונים ועוד<br>• לנתח ולסכם קבצים ומחקרים ארוכים עם NotebookLM<br>• לבנות כלי AI מותאמים אישית (Gems) למשימות ספציפיות<br>• להפוך מסמכים לתוכן: ליצור פודקאסטים, סרטונים ושאלונים<br>• כיצד לשמור על אבטחת מידע ופרטיות עם Gemini<br>• להטמיע את כלי ה-AI של גוגל בתוך Google Workspace<br><br><b class='text-blue-400 block mb-1'>מומלץ להכין מראש:</b>• דוגמאות ממשימות העבודה שלך עבור התרגול בסדנה<br>• חשבון Google פעיל<br><br><small class='text-slate-500'>*בסדנה יוצגו גם פיצ'רים מתוך המנוי בתשלום</small>", mainVideoId: "_TjnY8GuFHM", instructorVideoId: "baKPj_cg9k8", presentationUrl: "18-1.pdf", workbookUrl: "https://digitalculture-workshop-gemini.lovable.app/" },
            { id: 19, title: "סדנת Vibe Coding", type: "workshop", skill: "innovation", description: "<b class='text-white block mb-1'>לתרגם רעיונות לאפליקציות ומיני-אתרים בלי לכתוב קוד</b><br><b class='text-blue-400 block mt-2 mb-1'>בסיום הסדנה תדעו:</b>• ליצור אפליקציה מעוצבת על בסיס פרומפט איכותי<br>• להשתמש בכלי Vibe coding כדי להפוך רעיון לאתר בקליק<br>• לבנות ב-Base44 כלי ווב ודפי נחיתה מדויקים לצרכים שלכם<br>• לזהות משימות עבודה שניתן לייעל ע\"י בניית כלי ווב פשוט<br>• להפוך את הכלי שבניתם לזמין לשימוש<br>• לחבר את כלי ה-Vibe Coding לכלים חיצוניים<br>• כיצד לשמור על אבטחת מידע ופרטיות עם כלים אלו<br>• להטמיע את השימוש בכלי Vibe Coding בשגרה היום-יומית<br><br><b class='text-blue-400 block mb-1'>מומלץ להכין מראש:</b>• רעיון לכלי ווב פשוט (כגון כלי חישוב אוטומטי, דף נחיתה וכד') שתרצו ליצור.<br>• לפתוח חשבון בסיסי ב-Base44 לצורך תרגול מעשי.", mainVideoId: "oOiSW_Z6lsI", instructorVideoId: "q0QiKKijwk4", presentationUrl: "19-1.pdf", workbookUrl: "https://digitalculture-workshop-vibe-coding.lovable.app/" },
            { id: 20, title: "סדנת אוטומציה", type: "workshop", skill: "innovation", description: "<b class='text-white block mb-1'>להפוך משימות חוזרות לתהליכים אוטומטיים חכמים</b><br><b class='text-blue-400 block mt-2 mb-1'>בסיום הסדנה תדעו:</b>• לבנות תהליך עבודה אוטומטי בכלי AI<br>• לשלב מודלי שפה בתהליך האוטומציה<br>• לאתר ולתקן תקלות בתהליכי אוטומציה<br>• לזהות משימות שניתן לייעל ע\"י בניית אוטומציה<br>• להפוך את הכלי שבניתם לזמין לשימוש<br>• ליצור חיבורים מתקדמים (APIs, Webhooks) לכלים חיצוניים<br>• כיצד לשמור על אבטחת מידע ופרטיות עם כלים אלו<br>• להטמיע את השימוש בכלי אוטומציה בשגרת היום-יום<br><br><b class='text-blue-400 block mb-1'>מומלץ להכין מראש:</b>• משימה חוזרת שכוללת כמה שלבי עבודה, שתרצו להפוך לאוטומטית.<br>• לפתוח חשבון בסיסי ב-Make לצורך תרגול מעשי.", mainVideoId: "9TIDvtfGsQs", instructorVideoId: "iPYufW_lq6E", presentationUrl: "20-1.pdf", workbookUrl: "20-2.pdf" }
        ];

        // --- מערכת התחברות עם Base64 ---
        function handleLogin(e) {
            e.preventDefault();

            const inputEncoded = btoa(passwordInput.value.trim());
            
            if (inputEncoded === ENCODED_PASSWORD) {
                loginScreen.classList.add('hidden');
                dashboardScreen.classList.remove('hidden');
                renderList();
            } else {
                errorMessage.textContent = "סיסמה שגויה, אנא נסה שנית";
                errorMessage.classList.remove('hidden');
            }
            return false;
        }

        // --- הופעת תווית המידע על הוידאו ---
        function triggerOverlay() {
            videoInfoOverlay.classList.remove('opacity-0');
            videoInfoOverlay.classList.add('opacity-100');
            clearTimeout(overlayTimeout);
            
            overlayTimeout = setTimeout(() => {
                videoInfoOverlay.classList.remove('opacity-100');
                videoInfoOverlay.classList.add('opacity-0');
            }, 3500);
        }

        // --- ניהול מודל (חלון צף) ---
        function openModal(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;

            modalDesc.innerHTML = lesson.description;

            if (lesson.type === 'workshop') {

                modalInfoTitle.classList.remove('hidden');
                modalInfoTitle.classList.add('flex');

            // כפתור צפייה/המשך צפייה

                modalPlayBtn.className = "w-full flex items-center justify-center gap-2 py-3 rounded-xl font-semibold transition-all bg-slate-800 text-blue-400 border border-slate-700 hover:bg-slate-700";
                modalPlayText.textContent = "המשך צפייה";
            } else {
                modalPlayBtn.className = "w-full flex items-center justify-center gap-2 py-3 rounded-xl font-semibold transition-all bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-600/20";
                modalPlayText.textContent = "התחל צפייה";
            }
            
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            modal.classList.add('hidden');
            selectedLessonForModal = null;
        }

        function playFromModal() {
            if (selectedLessonForModal) {
                playLesson(selectedLessonForModal.id);
                closeModal();
            }
        }

        // --- שדרוג אבטחה: פתיחה בחלון קופץ נקי ---
        function openResource(type) {
            if (!selectedLessonForModal) return;
            let targetUrl = '';
            
            if (type === 'presentation' && selectedLessonForModal.presentationUrl) {
                targetUrl = selectedLessonForModal.presentationUrl;
            } else if (type === 'workbook' && selectedLessonForModal.workbookUrl) {
                targetUrl = selectedLessonForModal.workbookUrl;
            }

            if (targetUrl) {
                // הגדרת חלון ללא סרגלי כלים (ללא שורת כתובת מובהקת וללא כפתורים)
                const windowFeatures = "menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes,width=1000,height=800,top=100,left=100";
                window.open(targetUrl, 'CourseResource', windowFeatures);
            }
        }

        // פתיחת קישורים חיצוניים בחלון קופץ זהה
        function openExternalLink(url) {
            const windowFeatures = "menubar=no,toolbar=no,location=no,status=no,scrollbars=yes,resizable=yes,width=1000,height=800,top=100,left=100";
            window.open(url, 'ExternalTool', windowFeatures);
        }

        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal();
        });

        // --- הפעלת שיעור ביוטיוב ---
        function playLesson(lessonId) {
            const lesson = lessonsData.find(l => l.id === lessonId);
            if (!lesson) return;

            if (!isYoutubeReady) {
                alert("מערכת הוידאו עדיין נטענת. אנא המתן שניה ונסה שוב.");
                return;
            }

            activeLessonId = lesson.id;
            
            currentLessonTitle.textContent = lesson.title;
            currentLessonType.textContent = lesson.type === 'lecture' ? 'הרצאה תיאורטית' : 'סדנא מעשית';

            mainPlaceholder.classList.add('hidden');
            mainVideoContainer.classList.remove('hidden');
            instructorPlaceholder.classList.add('hidden');
            instructorWrapper.classList.remove('hidden');
            instructorLabel.classList.remove('hidden');
            
            triggerOverlay();

            if (!mainPlayer) {
                mainPlayer = new YT.Player('main-video', {
                    height: '100%',
                    width: '100%',
                    videoId: lesson.mainVideoId,
                    playerVars: {
                        'rel': 0, 
                        'modestbranding': 1, 
                        'playsinline': 1,
                        // מאפשר גישה רק מהדומיין שלך (עובד רק אם הוגדר ב-API, אך מוסיף שכבת הגנה)
                        'origin': window.location.origin 
                    },
                    events: {
                        'onStateChange': onMainPlayerStateChange
                    }
                });

                instructorPlayer = new YT.Player('instructor-video', {
                    height: '100%',
                    width: '100%',
                    videoId: lesson.instructorVideoId,
                    playerVars: {
                        'rel': 0,
                        'modestbranding': 1,
                        'controls': 0, 
                        'disablekb': 1, 
                        'playsinline': 1,
                        'origin': window.location.origin
                    },
                    events: {
                        'onReady': (e) => {
                            e.target.mute(); 
                        }
                    }
                });
            } else {
                mainPlayer.loadVideoById(lesson.mainVideoId);
                instructorPlayer.loadVideoById(lesson.instructorVideoId);
            }

            renderList(); 
        }

        // --- סנכרון הנגנים ---
        function onMainPlayerStateChange(event) {
            triggerOverlay();
            
            if (!instructorPlayer || typeof instructorPlayer.playVideo !== 'function') return;

            if (event.data === YT.PlayerState.PLAYING) {
                const mainTime = mainPlayer.getCurrentTime();
                const instTime = instructorPlayer.getCurrentTime();
                if (Math.abs(mainTime - instTime) > 0.5) {
                    instructorPlayer.seekTo(mainTime, true);
                }
                instructorPlayer.playVideo();
            } 
            else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.BUFFERING) {
                instructorPlayer.pauseVideo();
            }
            else if (event.data === YT.PlayerState.ENDED) {
                instructorPlayer.stopVideo();
            }
        }

        // --- סינון תוכן עניינים לפי מיומנויות ---
        function toggleFilter(skillId) {
            if (currentFilter === skillId) {
                currentFilter = 'all'; 
            } else {
                currentFilter = skillId; 
            }
            
            const allSkills = ['ai', 'research', 'management', 'innovation', 'design'];
            allSkills.forEach(id => {
                const btn = document.getElementById('filter-' + id);
                if (!btn) return;
                if (currentFilter === id) {
                    btn.className = "bg-blue-500/20 text-blue-400 border border-blue-500/30 px-2 py-1 rounded-md transition-colors font-bold";
                } else {
                    btn.className = "bg-slate-800 hover:bg-slate-700 text-slate-400 border border-transparent px-2 py-1 rounded-md transition-colors";
                }
            });
            
            renderList();
        }

        // --- רינדור רשימה צדדית ---
        function renderList() {
            lessonList.innerHTML = '';
            
            let filteredLessons = currentFilter === 'all' 
                ? [...lessonsData] 
                : lessonsData.filter(lesson => lesson.skill === currentFilter);
            
            // סידור מחדש: סדנאות מופיעות לפני הרצאות
            filteredLessons.sort((a, b) => {
                if (a.type === 'workshop' && b.type === 'lecture') return -1;
                if (a.type === 'lecture' && b.type === 'workshop') return 1;
                return a.id - b.id; // שומר על הסדר המספרי בתוך כל קבוצה (16-20, ואז 1-15)
            });
            
            filteredLessons.forEach((lesson, index) => {
                const isActive = activeLessonId === lesson.id;
                const isLecture = lesson.type === 'lecture';
                
                const typeClass = isLecture ? 'bg-blue-500/20 text-blue-400' : 'bg-purple-500/20 text-purple-400';
                const textClass = isActive ? 'text-blue-400' : 'text-slate-200';
                const borderClass = isActive ? 'border border-blue-500/30 bg-slate-800/60' : 'border border-transparent bg-slate-800/20 hover:bg-slate-800/40';

                // תגיות בולטות להרצאה או סדנא
                const typeBadge = isLecture
                    ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20 leading-none">הרצאה</span>`
                    : `<span class="text-[9px] px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 border border-purple-500/20 leading-none">סדנא</span>`;

                const itemHtml = `
                    <button onclick="openModal(${lesson.id})" class="w-full px-2.5 py-2 flex items-center justify-between text-right rounded-lg transition-all duration-200 ${borderClass} group">
                        <div class="flex items-center gap-3 w-full overflow-hidden">
                            <span class="w-7 h-7 flex-shrink-0 rounded-md flex items-center justify-center text-[12px] font-bold ${typeClass}">
                                ${index + 1}
                            </span>
                            <div class="flex flex-col items-start truncate overflow-hidden">
                                <span class="text-[13px] font-medium ${textClass} truncate w-full text-right mb-0.5">
                                    ${lesson.title}
                                </span>
                                <div class="flex items-center gap-1.5 mt-0.5">
                                    ${typeBadge}
                                    <span class="text-[10px] text-slate-400 truncate">${skillsMap[lesson.skill]}</span>
                                </div>
                            </div>
                        </div>
                        <div class="flex-shrink-0 ml-1">
                        ${isActive 
                            ? `<i data-lucide="play-circle" class="w-4 h-4 text-blue-400"></i>` 
                            : `<i data-lucide="info" class="w-4 h-4 text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity"></i>`
                        }
                        </div>
                    </button>
                `;
                
                lessonList.insertAdjacentHTML('beforeend', itemHtml);
            });

            if (typeof lucide !== 'undefined') { lucide.createIcons(); }
        }
    </script>
</body>
</html>
